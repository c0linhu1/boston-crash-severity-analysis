<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }
    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.1.0"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {
        "$schema": "https://vega.github.io/schema/vega-lite/v6.1.0.json",
        "config": {
          "view": { "continuousWidth": 300, "continuousHeight": 300 }
        },
        "data": {
          "values": [
            { "WEATHER_SIMPLE": "Clear",    "CRASH_SEVERITY_DESCR": "Fatal injury",                          "count": 4 },
            { "WEATHER_SIMPLE": "Clear",    "CRASH_SEVERITY_DESCR": "Non-fatal injury",                      "count": 825 },
            { "WEATHER_SIMPLE": "Clear",    "CRASH_SEVERITY_DESCR": "Property damage only (none injured)",   "count": 1536 },
            { "WEATHER_SIMPLE": "Cloudy",   "CRASH_SEVERITY_DESCR": "Non-fatal injury",                      "count": 65 },
            { "WEATHER_SIMPLE": "Cloudy",   "CRASH_SEVERITY_DESCR": "Property damage only (none injured)",   "count": 142 },
            { "WEATHER_SIMPLE": "Rain",     "CRASH_SEVERITY_DESCR": "Fatal injury",                          "count": 2 },
            { "WEATHER_SIMPLE": "Rain",     "CRASH_SEVERITY_DESCR": "Non-fatal injury",                      "count": 98 },
            { "WEATHER_SIMPLE": "Rain",     "CRASH_SEVERITY_DESCR": "Property damage only (none injured)",   "count": 199 },
            { "WEATHER_SIMPLE": "Snow/Ice", "CRASH_SEVERITY_DESCR": "Non-fatal injury",                      "count": 11 },
            { "WEATHER_SIMPLE": "Snow/Ice", "CRASH_SEVERITY_DESCR": "Property damage only (none injured)",   "count": 34 },
            { "WEATHER_SIMPLE": "Fog",      "CRASH_SEVERITY_DESCR": "Non-fatal injury",                      "count": 2 },
            { "WEATHER_SIMPLE": "Fog",      "CRASH_SEVERITY_DESCR": "Property damage only (none injured)",   "count": 1 }
          ]
        },
        "mark": { "type": "bar" },
        "encoding": {
          "x": {
            "field": "WEATHER_SIMPLE",
            "type": "ordinal",
            "title": "Weather Condition",
            "sort": ["Clear", "Cloudy", "Rain", "Snow/Ice", "Fog"],
            "axis": { "labelAngle": 0, "labelFontSize": 12, "titleFontSize": 13 }
          },
          "y": {
            "field": "count",
            "type": "quantitative",
            "title": "Number of Crashes",
            "stack": "zero",
            "axis": { "labelFontSize": 11, "titleFontSize": 13 }
          },
          "color": {
            "field": "CRASH_SEVERITY_DESCR",
            "type": "nominal",
            "title": "Crash Severity",
            "sort": ["Fatal injury", "Non-fatal injury", "Property damage only (none injured)"],
            "scale": {
              "domain": ["Fatal injury", "Non-fatal injury", "Property damage only (none injured)"],
              "range":  ["#c23b22",      "#f4a261",          "#2c7bb6"]
            },
            "legend": { "labelFontSize": 11, "titleFontSize": 12 }
          },
          "order": {
            "field": "CRASH_SEVERITY_DESCR",
            "sort": "descending"
          },
          "tooltip": [
            { "field": "WEATHER_SIMPLE",         "type": "ordinal",      "title": "Weather" },
            { "field": "CRASH_SEVERITY_DESCR",   "type": "nominal",      "title": "Severity" },
            { "field": "count",                  "type": "quantitative", "title": "Crash Count" }
          ]
        },
        "title": {
          "text": "Crash Severity Breakdown by Weather Condition (Boston, Jan 2025)",
          "fontSize": 16,
          "anchor": "middle"
        },
        "width": 600,
        "height": 400
      };

      var embedOpt = { "mode": "vega-lite" };

      function showError(el, error) {
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }

      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);
  </script>
</body>
</html>
